<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    /* ダークを既定にし、明るい場所（工場・配送）向けに切替できるようにする */
    :root {
      --bg: #0d0d0f;
      --panel: #141416;
      --card: #1c1c20;
      --card-hover: #232329;
      --line: #2a2a31;
      --line-soft: #202027;
      --text: #f2f2f4;
      --muted: #9a9aa4;
      --faint: #6d6d77;
      --btn-line: #3a3a43;
      --gehan-bg: #e7e0ff; --gehan-fg: #4733a6;
      --print-bg: #d7f2e2; --print-fg: #196443;
      --outer-bg: #ffeacd; --outer-fg: #8a5514;
      --komu-bg:  #ffdfe4; --komu-fg:  #a32c45;
      --none-bg:  #26262d; --none-fg:  #9a9aa4;
      --warn-bg:  #3b1b1f; --warn-fg:  #ff909a;
      --memo: #e8b04b;
      --ok: #4fc98a;
      --accent: #8b7bf3;
      --accent-fg: #12111c;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
    :root[data-theme="light"] {
      --bg: #eef0f3;
      --panel: #ffffff;
      --card: #ffffff;
      --card-hover: #f6f8fb;
      --line: #dfe3e9;
      --line-soft: #eceff3;
      --text: #1b1d21;
      --muted: #626973;
      --faint: #8a919c;
      --btn-line: #cfd5de;
      --gehan-bg: #ece6ff; --gehan-fg: #4733a6;
      --print-bg: #ddf3e6; --print-fg: #166139;
      --outer-bg: #ffeed7; --outer-fg: #7d4d11;
      --komu-bg:  #ffe3e8; --komu-fg:  #9c2740;
      --none-bg:  #eceff3; --none-fg:  #626973;
      --warn-bg:  #fdecec; --warn-fg:  #b3261e;
      --memo: #a06b12;
      --ok: #1f7a4d;
      --accent: #4b3fd4;
      --accent-fg: #ffffff;
      --shadow: 0 1px 2px rgba(16,24,40,.06);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; font-size: 14px; cursor: pointer; color: inherit; }
    input, select { font-family: inherit; font-size: 14px; color: inherit; }
    svg { flex: none; }

    /* ------- 上部バー ------- */
    .topbar {
      position: sticky; top: 0; z-index: 30;
      background: var(--bg);
      padding: 14px 20px 10px;
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    }
    .search {
      flex: 1 1 320px; min-width: 200px;
      display: flex; align-items: center; gap: 10px;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 0 14px; height: 46px;
    }
    .search svg { color: var(--faint); }
    .search input {
      flex: 1; background: none; border: none; outline: none;
      font-size: 15px; height: 100%;
    }
    .search input::placeholder { color: var(--faint); }
    .datebox {
      display: flex; align-items: center; gap: 10px;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 0 14px; height: 46px;
    }
    .datebox svg { color: var(--faint); }
    .datebox input { background: none; border: none; outline: none; font-size: 15px; }
    .linkbtn {
      background: none; border: none; color: var(--muted);
      padding: 6px 8px; border-radius: 8px;
    }
    .linkbtn:hover { color: var(--text); background: var(--panel); }
    .btn {
      background: var(--panel); border: 1px solid var(--btn-line);
      border-radius: 10px; padding: 8px 14px;
    }
    .btn:hover { background: var(--card-hover); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: .45; cursor: default; }
    .iconbtn {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; width: 40px; height: 40px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .iconbtn:hover { background: var(--card-hover); }
    .toolrow {
      width: 100%; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      font-size: 12.5px; color: var(--faint);
    }
    .toolrow label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
    .notice {
      width: 100%; font-size: 13px; color: var(--warn-fg); background: var(--warn-bg);
      border-radius: 10px; padding: 8px 12px;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ------- 未定エリア ------- */
    .undecided { padding: 0 20px 4px; }
    .undecided-inner {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 14px; padding: 10px 14px;
    }
    .undecided-head { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
    .undecided-head .badge {
      background: var(--memo); color: #23180a; border-radius: 999px;
      padding: 3px 14px; font-size: 13px; font-weight: 700;
    }
    .undecided-head .hint { font-size: 12.5px; color: var(--faint); }
    .undecided-list { display: flex; gap: 10px; overflow-x: auto; padding: 12px 2px 4px; }
    .u-card {
      flex: 0 0 250px; background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 12px 14px;
    }
    .u-card.stale { border-color: var(--memo); }
    .u-card .stale-mark { font-size: 12px; color: var(--memo); margin-top: 2px; }
    .u-buttons { display: flex; gap: 6px; margin-top: 10px; }
    .u-buttons .btn { flex: 1; padding: 6px 0; font-size: 13px; }

    /* ------- ボード ------- */
    .board {
      display: grid; grid-template-columns: 0.9fr 1.45fr 1fr;
      gap: 16px; padding: 12px 20px 48px; align-items: start;
    }
    .col-head {
      display: flex; align-items: baseline; gap: 10px;
      padding: 4px 4px 10px; flex-wrap: wrap;
    }
    .col-head .name { font-size: 15px; font-weight: 700; color: var(--muted); }
    .col-head .sub { font-size: 12.5px; color: var(--faint); }
    .col-head .week-nav { margin-left: auto; display: flex; gap: 4px; }
    .col-head .week-nav button {
      background: none; border: 1px solid var(--line); border-radius: 8px;
      width: 26px; height: 26px; line-height: 1; color: var(--muted);
    }
    .col-head .week-nav button:hover { color: var(--text); background: var(--panel); }
    .col-body {
      background: var(--panel); border-radius: 16px; padding: 14px;
      display: flex; flex-direction: column; gap: 10px; min-height: 90px;
    }
    .group-title { font-size: 13.5px; font-weight: 500; color: var(--muted); padding: 6px 2px 0; }
    .group-title.today { color: var(--accent); font-weight: 700; }
    .group-title.late { color: var(--warn-fg); }
    .group { display: flex; flex-direction: column; gap: 10px; }
    .empty { color: var(--faint); font-size: 13px; padding: 2px 2px 6px; }

    /* ------- カード ------- */
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow);
    }
    .card.clickable { cursor: pointer; }
    .card.clickable:hover { background: var(--card-hover); }
    .card.warn { border-color: var(--warn-fg); }
    .card.hit { outline: 2px solid var(--memo); outline-offset: 1px; }
    .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .order-no {
      font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
      font-size: 12.5px; color: var(--faint); letter-spacing: .02em;
    }
    .card-top .badges { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .item { font-weight: 700; font-size: 15.5px; line-height: 1.45; margin-bottom: 8px; }
    .card-bottom { display: flex; align-items: flex-end; gap: 10px; }
    .card-bottom .info { flex: 1; min-width: 0; }
    .meta { font-size: 12.5px; color: var(--muted); }
    .memo { font-size: 12.5px; color: var(--memo); display: flex; gap: 5px; align-items: flex-start; margin-top: 4px; }
    .memo svg { margin-top: 3px; }
    .complete {
      background: none; border: 1px solid var(--btn-line); color: var(--text);
      border-radius: 9px; padding: 6px 14px; font-size: 13.5px;
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .complete:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    .stage-badge {
      font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 12px;
      background: var(--none-bg); color: var(--none-fg); white-space: nowrap;
    }
    .stage-badge.gehan { background: var(--gehan-bg); color: var(--gehan-fg); }
    .stage-badge.print { background: var(--print-bg); color: var(--print-fg); }
    .stage-badge.outer { background: var(--outer-bg); color: var(--outer-fg); }
    .stage-badge.komu  { background: var(--komu-bg);  color: var(--komu-fg); }
    .warn-badge {
      font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 12px;
      background: var(--warn-bg); color: var(--warn-fg); white-space: nowrap;
    }
    .card.done { background: none; border-color: var(--line-soft); box-shadow: none; }
    .card.done .item { color: var(--muted); font-weight: 500; margin-bottom: 4px; }
    .delivered { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .delivered svg { color: var(--ok); }

    /* ------- 編集パネル ------- */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      display: flex; align-items: flex-start; justify-content: center;
      padding: 40px 16px; z-index: 60; overflow-y: auto;
    }
    .panel {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 16px; width: 100%; max-width: 560px; padding: 20px 22px;
    }
    .panel h2 { margin: 0 0 2px; font-size: 17px; }
    .panel .panel-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 16px; }
    .field { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .field > label { width: 96px; font-size: 13px; color: var(--muted); flex: none; }
    .field input[type="date"], .field input[type="text"], .field select {
      flex: 1; background: var(--card); border: 1px solid var(--line);
      border-radius: 9px; padding: 8px 10px;
    }
    .stage-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .stage-row > .name { width: 56px; font-weight: 700; font-size: 14px; flex: none; }
    .stage-row .pair { flex: 1; display: flex; align-items: center; gap: 6px; }
    .stage-row .pair small { color: var(--faint); }
    .stage-row input[type="date"] {
      flex: 1; background: var(--card); border: 1px solid var(--line);
      border-radius: 9px; padding: 8px 10px;
    }
    .panel-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
    .divider { border-top: 1px solid var(--line); margin: 14px 0; }

    /* ------- トースト ------- */
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: var(--card); border: 1px solid var(--line); color: var(--text);
      border-radius: 12px; padding: 12px 16px;
      display: flex; align-items: center; gap: 14px; z-index: 80;
      box-shadow: 0 8px 24px rgba(0,0,0,.45); font-size: 14px;
    }
    .toast .btn { padding: 5px 12px; }
    .toast.err { border-color: var(--warn-fg); color: var(--warn-fg); }
    .hidden { display: none !important; }

    @media (max-width: 900px) {
      .board { grid-template-columns: 1fr; padding: 10px 12px 40px; gap: 20px; }
      .topbar { position: static; padding: 12px; }
      .undecided { padding: 0 12px 4px; }
      .search { flex-basis: 100%; }
      .field > label { width: 76px; }
      .stage-row { flex-wrap: wrap; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

<header class="topbar">
  <div class="search">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="受注NOで検索" autocomplete="off" aria-label="受注NOで検索">
  </div>

  <div class="datebox">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
    <input id="jump" type="date" aria-label="表示する週の日付">
  </div>

  <button class="linkbtn" id="thisWeek">今週へ</button>

  <span id="editorTools" style="display:inline-flex;gap:8px;align-items:center;">
    <button class="btn" id="importBtn">いま取込む</button>
  </span>
  <button class="iconbtn" id="themeBtn" title="配色を切り替え" aria-label="配色を切り替え">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <div class="toolrow">
    <span id="meta">読み込み中…</span>
    <button class="linkbtn hidden" id="pinBtn" style="font-size:12.5px;padding:2px 8px;">編集モードに入る</button>
    <label id="excludedWrap" class="hidden"><input type="checkbox" id="showExcluded"> 対象外も表示</label>
  </div>
  <div class="notice hidden" id="notice"></div>
</header>

<section class="undecided" id="undecidedArea">
  <div class="undecided-inner">
    <div class="undecided-head" id="undecidedHead">
      <span class="badge" id="undecidedBadge">未定 0件</span>
      <span class="hint" id="undecidedHint">クリックで展開／営業に確認するリスト</span>
    </div>
    <div class="undecided-list hidden" id="undecidedList"></div>
  </div>
</section>

<main class="board" id="board">
  <section id="colDone">
    <div class="col-head"><span class="name">完了</span><span class="sub" id="countDone"></span></div>
    <div class="col-body" id="bodyDone"></div>
  </section>

  <section id="colWeek">
    <div class="col-head">
      <span class="name" id="weekTitle">今週</span><span class="sub" id="weekRange"></span><span class="sub" id="countWeek"></span>
      <span class="week-nav">
        <button id="prevWeek" title="前の週" aria-label="前の週">‹</button>
        <button id="nextWeek" title="次の週" aria-label="次の週">›</button>
      </span>
    </div>
    <div class="col-body" id="bodyWeek"></div>
  </section>

  <section id="colLater">
    <div class="col-head"><span class="name">来週以降</span><span class="sub" id="countLater"></span></div>
    <div class="col-body" id="bodyLater"></div>
  </section>
</main>

<div class="overlay hidden" id="overlay">
  <div class="panel" id="panel"></div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
// ===========================================================================
// 状態
// ===========================================================================
const state = {
  data: null,
  pin: (function () { try { return localStorage.getItem('board-pin') || ''; } catch (e) { return ''; } })(),
  pinJustEntered: false,
  weekStart: mondayOf(new Date()),
  search: '',
  undecidedOpen: false,
  includeExcluded: false,
  editingOrderNo: null,
  undoToken: null,
  busy: false
};
const REFRESH_MS = 30000;
const WEEKDAY_JA = ['日', '月', '火', '水', '木', '金', '土'];

// ===========================================================================
// 日付ユーティリティ（画面側は yyyy/MM/dd 文字列で扱う）
// ===========================================================================
function pad2(n) { return n < 10 ? '0' + n : String(n); }
function fmt(d) { return d.getFullYear() + '/' + pad2(d.getMonth() + 1) + '/' + pad2(d.getDate()); }
function parseYmd(s) {
  if (!s) return null;
  const m = String(s).match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (!m) return null;
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
}
function addDays(d, n) { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function mondayOf(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const w = x.getDay();               // 0=日
  const diff = (w === 0) ? -6 : 1 - w; // 月曜起点
  return addDays(x, diff);
}
function shortDate(s) {
  const d = parseYmd(s);
  return d ? (d.getMonth() + 1) + '/' + d.getDate() : s;
}
function labelDate(s) {
  const d = parseYmd(s);
  if (!d) return s;
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + WEEKDAY_JA[d.getDay()];
}
function toInputDate(s) {
  const d = parseYmd(s);
  return d ? d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) : '';
}
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ===========================================================================
// 通信
// ===========================================================================
function auth_() { return { pin: state.pin }; }
function load(silent) {
  if (!silent) setMeta('読み込み中…');
  google.script.run
    .withSuccessHandler(function (data) {
      state.data = data;
      render();
    })
    .withFailureHandler(function (err) {
      showToast('読み込みに失敗しました：' + err.message, true);
      setMeta('読み込み失敗');
    })
    .getBoardData({ includeExcluded: state.includeExcluded, pin: state.pin });
}

function call(fnName, args, onOk) {
  if (state.busy) return;
  state.busy = true;
  const runner = google.script.run
    .withSuccessHandler(function (res) { state.busy = false; if (onOk) onOk(res); })
    .withFailureHandler(function (err) { state.busy = false; showToast(err.message, true); load(true); });
  runner[fnName].apply(runner, args);
}

// ===========================================================================
// 描画
// ===========================================================================
function setMeta(text, tooltip) {
  const el = document.getElementById('meta');
  el.textContent = text;
  if (tooltip) el.setAttribute('title', tooltip);
  else el.removeAttribute('title');
}

function render() {
  const d = state.data;
  if (!d) return;

  document.getElementById('editorTools').classList.toggle('hidden', !d.canEdit);
  const notice = document.getElementById('notice');
  if (d.canEdit && !d.authConfigured) {
    notice.textContent = '更新できる人がまだ設定されていません。スクリプトプロパティ EDITOR_PIN に合言葉を登録してください。'
      + 'いまはスクリプトの所有者だけが更新できる状態です。';
    notice.classList.remove('hidden');
  } else {
    notice.classList.add('hidden');
  }
  document.getElementById('excludedWrap').classList.toggle('hidden', !d.canEdit);
  document.getElementById('pinBtn').classList.toggle('hidden', !(d.pinConfigured && !d.canEdit));
  if (state.pinJustEntered) {
    state.pinJustEntered = false;
    if (d.canEdit) {
      showToast('編集モードに入りました');
    } else {
      showToast('合言葉が違います', true);
      state.pin = '';
      try { localStorage.removeItem('board-pin'); } catch (e) {}
    }
  }
  // メールアドレスは画面に出さない（誰の画面かは本人にしか関係しないため）。
  // 権限まわりの確認用に、マウスを乗せたときだけ表示する。
  setMeta((d.canEdit ? '更新可' : '閲覧のみ') +
    '　最終取込 ' + (d.lastImportAt || '—') + '　表示 ' + d.fetchedAt.split(' ')[1],
    d.userEmail ? 'ログイン中：' + d.userEmail : '');

  renderUndecided();
  renderBoard();
  applySearch();
}

function renderUndecided() {
  const d = state.data;
  const rows = d.rows.filter(function (r) { return r.category === '未定'; })
    .sort(function (a, b) { return (a.due || '9999').localeCompare(b.due || '9999'); });

  document.getElementById('undecidedBadge').textContent = '未定 ' + rows.length + '件';
  const stale = rows.filter(function (r) { return r.undecidedDays !== null && r.undecidedDays >= d.staleDays; }).length;
  document.getElementById('undecidedHint').textContent =
    (stale > 0 ? 'うち ' + stale + '件は' + d.staleDays + '日以上未定 ・ ' : '') +
    (state.undecidedOpen ? 'クリックで折りたたむ' : 'クリックで展開／営業に確認するリスト');

  const list = document.getElementById('undecidedList');
  list.classList.toggle('hidden', !state.undecidedOpen);
  if (!state.undecidedOpen) return;

  if (rows.length === 0) {
    list.innerHTML = '<div class="empty">未定の案件はありません。</div>';
    return;
  }
  list.innerHTML = rows.map(function (r) {
    const isStale = r.undecidedDays !== null && r.undecidedDays >= d.staleDays;
    return '<div class="u-card' + (isStale ? ' stale' : '') + '" data-order="' + esc(r.orderNo) + '">' +
      '<div class="order-no">' + esc(r.orderNo) + '</div>' +
      '<div class="item" style="margin-bottom:4px;">' + esc(r.item) + '</div>' +
      '<div class="meta">' + esc(r.customer) + ' ／ ' + esc(r.sales) + '</div>' +
      '<div class="meta">納期 ' + (r.due ? shortDate(r.due) : '—') + '</div>' +
      (isStale ? '<div class="stale-mark">未定のまま ' + r.undecidedDays + '日</div>' : '') +
      (d.canEdit
        ? '<div class="u-buttons">' +
            '<button class="btn primary" data-cat="社内" data-order="' + esc(r.orderNo) + '">社内</button>' +
            '<button class="btn" data-cat="社外" data-order="' + esc(r.orderNo) + '">社外</button>' +
            '<button class="btn" data-cat="対象外" data-order="' + esc(r.orderNo) + '">対象外</button>' +
          '</div>'
        : '') +
      '</div>';
  }).join('');
}

function renderBoard() {
  const d = state.data;
  const weekStart = state.weekStart;
  const weekEnd = addDays(weekStart, 4);          // 月〜金
  const weekStartStr = fmt(weekStart);
  const weekEndStr = fmt(weekEnd);

  document.getElementById('weekTitle').textContent =
    fmt(mondayOf(new Date())) === weekStartStr ? '今週' : '表示中の週';
  document.getElementById('weekRange').textContent =
    shortDate(weekStartStr) + ' – ' + shortDate(weekEndStr);

  const active = [], completed = [], excluded = [];
  d.rows.forEach(function (r) {
    if (r.category === '未定') return;
    if (r.category === '対象外') { excluded.push(r); return; }
    if (r.isCompleted) { completed.push(r); return; }
    active.push(r);
  });

  // --- 完了カラム ---
  completed.sort(function (a, b) { return (b.deliveredAt || '').localeCompare(a.deliveredAt || ''); });
  document.getElementById('countDone').textContent = d.completedVisibleDays + '日間で自動非表示';
  document.getElementById('bodyDone').innerHTML = completed.length
    ? '<div class="group">' + completed.map(completedCardHtml).join('') + '</div>'
    : '<div class="empty">直近' + d.completedVisibleDays + '日に納品完了した案件はありません。</div>';

  // --- 今週カラム（遅れ ＋ 月〜金） ---
  const late = active.filter(function (r) { return r.placeDate && r.placeDate < weekStartStr; });
  let weekHtml = '';
  let weekCount = late.length;
  if (late.length > 0) {
    weekHtml += '<div class="group-title late">遅れ（予定日超過） ' + late.length + '件</div>' +
      '<div class="group">' + sortRows(late).map(cardHtml).join('') + '</div>';
  }
  let hadAnyDay = false;
  for (let i = 0; i < 5; i++) {
    const dayStr = fmt(addDays(weekStart, i));
    const rows = active.filter(function (r) { return r.placeDate === dayStr; });
    weekCount += rows.length;
    const isToday = dayStr === d.today;
    if (rows.length === 0 && !isToday) continue;   // 空の日は見出しを出さない（本日だけは常に出す）
    hadAnyDay = true;
    weekHtml += '<div class="group-title' + (isToday ? ' today' : '') + '">' + labelDate(dayStr) +
      (isToday ? '（本日）' : '') + '</div>' +
      (rows.length
        ? '<div class="group">' + sortRows(rows).map(cardHtml).join('') + '</div>'
        : '<div class="empty">本日の予定はありません</div>');
  }
  if (!hadAnyDay && late.length === 0) weekHtml += '<div class="empty">この週に予定されている案件はありません</div>';
  document.getElementById('countWeek').textContent = weekCount + '件';
  document.getElementById('bodyWeek').innerHTML = weekHtml;

  // --- 来週以降カラム（日付順 ＋ 最下部に日程未定） ---
  const later = active.filter(function (r) { return r.placeDate && r.placeDate > weekEndStr; });
  const undated = active.filter(function (r) { return !r.placeDate; });
  const byDate = {};
  later.forEach(function (r) { (byDate[r.placeDate] = byDate[r.placeDate] || []).push(r); });
  const dates = Object.keys(byDate).sort();

  let laterHtml = dates.map(function (day) {
    return '<div class="group-title">' + labelDate(day) + '</div>' +
      '<div class="group">' + sortRows(byDate[day]).map(cardHtml).join('') + '</div>';
  }).join('');

  if (undated.length > 0) {
    laterHtml += '<div class="group-title">日程未定</div>' +
      '<div class="group">' + sortRows(undated).map(cardHtml).join('') + '</div>';
  }
  if (state.includeExcluded && excluded.length > 0) {
    laterHtml += '<div class="group-title">対象外</div>' +
      '<div class="group">' + sortRows(excluded).map(cardHtml).join('') + '</div>';
  }
  if (!laterHtml) laterHtml = '<div class="empty">来週以降の予定はありません</div>';
  document.getElementById('countLater').textContent = (later.length + undated.length) + '件';
  document.getElementById('bodyLater').innerHTML = laterHtml;
}

function sortRows(rows) {
  return rows.slice().sort(function (a, b) {
    const c = (a.due || '9999/99/99').localeCompare(b.due || '9999/99/99');
    return c !== 0 ? c : String(a.orderNo).localeCompare(String(b.orderNo));
  });
}

function cardHtml(r) {
  const d = state.data;
  const warn = r.warnings.length > 0;
  const badge = r.placeDate
    ? '<span class="stage-badge ' + r.currentStage + '">' + esc(r.currentStageName) + '</span>'
    : '<span class="stage-badge">日程未定</span>';
  return '<div class="card clickable' + (warn ? ' warn' : '') + '" data-order="' + esc(r.orderNo) + '">' +
    '<div class="card-top">' +
      '<span class="order-no">' + esc(r.orderNo) + '</span>' +
      '<span class="badges">' +
        r.warnings.map(function (w) { return '<span class="warn-badge">' + esc(w) + '</span>'; }).join('') +
        (r.category === '対象外' ? '<span class="stage-badge">対象外</span>' : '') +
        (r.skipOuter ? '<span class="stage-badge">外注スキップ</span>' : '') +
        badge +
      '</span>' +
    '</div>' +
    '<div class="item">' + esc(r.item) + '</div>' +
    '<div class="card-bottom">' +
      '<div class="info">' +
        '<div class="meta">' + esc(r.customer) + ' ／ ' + esc(r.sales) +
          (r.due ? ' ／ 納期 ' + shortDate(r.due) : '') + '</div>' +
        (r.memo
          ? '<div class="memo"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>' + esc(r.memo) + '</span></div>'
          : '') +
      '</div>' +
      (d.canEdit && r.currentStage
        ? '<button class="complete" data-complete="' + esc(r.orderNo) + '">完了 <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>'
        : '') +
    '</div>' +
  '</div>';
}

function completedCardHtml(r) {
  return '<div class="card done clickable" data-order="' + esc(r.orderNo) + '">' +
    '<div class="card-top"><span class="order-no">' + esc(r.orderNo) + '</span></div>' +
    '<div class="item">' + esc(r.item) + '</div>' +
    '<div class="delivered"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>納品済 ' + shortDate(r.deliveredAt) + '</div>' +
    '</div>';
}

// ===========================================================================
// 検索・ジャンプ
// ===========================================================================
function applySearch() {
  const q = state.search.trim().toLowerCase();
  const cards = document.querySelectorAll('.card, .u-card');
  let first = null;
  cards.forEach(function (el) {
    const hit = q && String(el.getAttribute('data-order') || '').toLowerCase().indexOf(q) >= 0;
    el.classList.toggle('hit', !!hit);
    if (hit && !first) first = el;
  });
  if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ===========================================================================
// 編集パネル
// ===========================================================================
function openPanel(orderNo) {
  const d = state.data;
  const r = d.rows.filter(function (x) { return x.orderNo === orderNo; })[0];
  if (!r) return;
  state.editingOrderNo = orderNo;

  const hidePrintStages = (r.category === '社外');   // 社外は下版・印刷・外注を表示しない
  const stageRows = d.stages.map(function (s) {
    if (hidePrintStages && ['gehan', 'print', 'outer'].indexOf(s.key) >= 0) return '';
    return '<div class="stage-row">' +
      '<span class="name">' + esc(s.name) + '</span>' +
      '<span class="pair">' +
        (s.hasPlan
          ? '<small>予定</small><input type="date" id="plan_' + s.key + '" value="' + toInputDate(r.plans[s.key]) + '">'
          : '<small>予定日欄なし（納期で配置）</small>') +
        '<small>完了</small><input type="date" id="done_' + s.key + '" value="' + toInputDate(r.dones[s.key]) + '">' +
      '</span>' +
    '</div>';
  }).join('');

  document.getElementById('panel').innerHTML =
    '<h2>' + esc(r.item) + '</h2>' +
    '<div class="panel-sub"><span class="order-no">' + esc(r.orderNo) + '</span> ／ ' +
      esc(r.customer) + ' ／ ' + esc(r.sales) + ' ／ 納期 ' + esc(r.due || '—') + '</div>' +
    '<div class="field"><label for="f_category">区分</label>' +
      '<select id="f_category">' + d.categories.map(function (c) {
        return '<option value="' + esc(c) + '"' + (c === r.category ? ' selected' : '') + '>' + esc(c) + '</option>';
      }).join('') + '</select></div>' +
    '<div class="field"><label for="f_skip">外注スキップ</label>' +
      '<span style="flex:1"><input type="checkbox" id="f_skip"' + (r.skipOuter ? ' checked' : '') +
      (r.category === '社内' ? '' : ' disabled') + '> <small style="color:var(--muted)">社内区分でのみ有効</small></span></div>' +
    '<div class="field"><label for="f_memo">メモ</label>' +
      '<input type="text" id="f_memo" maxlength="120" value="' + esc(r.memo) + '" placeholder="例：用紙 9/8入荷予定"></div>' +
    '<div class="divider"></div>' +
    stageRows +
    '<div class="panel-actions">' +
      '<button class="btn" id="panelCancel">キャンセル</button>' +
      '<button class="btn primary" id="panelSave">保存</button>' +
    '</div>';

  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('f_category').addEventListener('change', function () {
    const skip = document.getElementById('f_skip');
    skip.disabled = (this.value !== '社内');
    if (skip.disabled) skip.checked = false;
  });
  document.getElementById('panelCancel').addEventListener('click', closePanel);
  document.getElementById('panelSave').addEventListener('click', savePanel);
}

function closePanel() {
  state.editingOrderNo = null;
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('panel').innerHTML = '';
}

function savePanel() {
  const orderNo = state.editingOrderNo;
  if (!orderNo) return;
  const patch = { plans: {}, dones: {}, memo: '', skipOuter: false, category: '' };
  state.data.stages.forEach(function (s) {
    const plan = document.getElementById('plan_' + s.key);
    const done = document.getElementById('done_' + s.key);
    if (plan) patch.plans[s.key] = plan.value;
    if (done) patch.dones[s.key] = done.value;
  });
  patch.memo = document.getElementById('f_memo').value;
  patch.skipOuter = document.getElementById('f_skip').checked;
  patch.category = document.getElementById('f_category').value;

  document.getElementById('panelSave').disabled = true;
  call('saveRow', [orderNo, patch, auth_()], function () {
    closePanel();
    showToast('保存しました');
    load(true);
  });
}

// ===========================================================================
// トースト（取消つき）
// ===========================================================================
let toastTimer = null;
function showToast(message, isError, undoToken) {
  const el = document.getElementById('toast');
  el.className = 'toast' + (isError ? ' err' : '');
  el.innerHTML = '<span>' + esc(message) + '</span>' +
    (undoToken ? '<button class="btn" id="undoBtn">取消</button>' : '');
  if (undoToken) {
    state.undoToken = undoToken;
    document.getElementById('undoBtn').addEventListener('click', function () {
      const token = state.undoToken;
      state.undoToken = null;
      hideToast();
      call('undoComplete', [token, auth_()], function () {
        showToast(token.stageName + ' の完了を取り消しました');
        load(true);
      });
    });
  }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, isError ? 8000 : 15000);
}
function hideToast() {
  document.getElementById('toast').classList.add('hidden');
  document.getElementById('toast').innerHTML = '';
}

// ===========================================================================
// イベント
// ===========================================================================
document.addEventListener('click', function (ev) {
  const completeBtn = ev.target.closest('[data-complete]');
  if (completeBtn) {
    ev.stopPropagation();
    const orderNo = completeBtn.getAttribute('data-complete');
    completeBtn.disabled = true;
    call('completeCurrentStage', [orderNo, auth_()], function (token) {
      showToast(token.stageName + ' を完了にしました（' + orderNo + '）', false, token);
      load(true);
    });
    return;
  }

  const catBtn = ev.target.closest('[data-cat]');
  if (catBtn) {
    ev.stopPropagation();
    const orderNo = catBtn.getAttribute('data-order');
    const cat = catBtn.getAttribute('data-cat');
    catBtn.disabled = true;
    call('setCategory', [orderNo, cat, auth_()], function () {
      showToast(orderNo + ' を「' + cat + '」にしました');
      load(true);
    });
    return;
  }

  const card = ev.target.closest('.card.clickable, .u-card');
  if (card && state.data && state.data.canEdit) {
    openPanel(card.getAttribute('data-order'));
    return;
  }

  if (ev.target.id === 'overlay') closePanel();
});

document.getElementById('undecidedHead').addEventListener('click', function () {
  state.undecidedOpen = !state.undecidedOpen;
  renderUndecided();
  applySearch();
});

document.getElementById('q').addEventListener('input', function () {
  state.search = this.value;
  applySearch();
});

document.getElementById('jump').addEventListener('change', function () {
  const d = parseYmd(this.value);
  if (!d) return;
  state.weekStart = mondayOf(d);
  renderBoard();
  applySearch();
});

document.getElementById('thisWeek').addEventListener('click', function () {
  state.weekStart = mondayOf(new Date());
  document.getElementById('jump').value = '';
  renderBoard();
  applySearch();
});

document.getElementById('prevWeek').addEventListener('click', function () {
  state.weekStart = addDays(state.weekStart, -7);
  renderBoard();
  applySearch();
});

document.getElementById('nextWeek').addEventListener('click', function () {
  state.weekStart = addDays(state.weekStart, 7);
  renderBoard();
  applySearch();
});

document.getElementById('importBtn').addEventListener('click', function () {
  const btn = this;
  btn.disabled = true;
  setMeta('取込中…');
  call('runImportNow', [auth_()], function (res) {
    btn.disabled = false;
    showToast(res.message);
    load(true);
  });
  setTimeout(function () { btn.disabled = false; }, 30000);
});

document.getElementById('showExcluded').addEventListener('change', function () {
  state.includeExcluded = this.checked;
  load(true);
});

document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape' && state.editingOrderNo) closePanel();
});

// 編集モード（合言葉）。公開設定が「全員」のときは、メールの代わりにこれで工務担当者を判定する
document.getElementById('pinBtn').addEventListener('click', function () {
  const pin = window.prompt('合言葉を入力してください');
  if (pin === null || !pin.trim()) return;
  state.pin = pin.trim();
  state.pinJustEntered = true;
  try { localStorage.setItem('board-pin', state.pin); } catch (e) {}
  load(true);
});

// 配色切替（既定はダーク。工場・配送の明るい場所向けにライトも用意）
(function () {
  let saved = '';
  try { saved = localStorage.getItem('board-theme') || ''; } catch (e) { saved = ''; }
  if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
  document.getElementById('themeBtn').addEventListener('click', function () {
    const light = document.documentElement.getAttribute('data-theme') === 'light';
    if (light) document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', 'light');
    try { localStorage.setItem('board-theme', light ? '' : 'light'); } catch (e) {}
  });
})();

// 30秒ごとの自動更新。編集パネルを開いている間は止める。
setInterval(function () {
  if (state.editingOrderNo) return;
  if (state.busy) return;
  load(true);
}, REFRESH_MS);

load(false);
</script>
